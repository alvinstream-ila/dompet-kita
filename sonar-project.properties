# ============================================================
# 🔬 SONARQUBE CLOUD — DOMPET KITA MONOREPO
# Sovereign Singularity v7.3.0 | Cognitive Code Intelligence
# ============================================================

sonar.projectKey=alvinstream-ila_dompet-kita
sonar.organization=alvinstream-ila
sonar.projectName=Dompet Kita
sonar.projectVersion=7.3.0

# ─── Source Configuration ───────────────────────────────────
sonar.sources=apps/frontend/src,apps/backend/app,apps/backend/routes,apps/backend/config,apps/backend/resources/views
sonar.tests=apps/backend/tests

# ─── Exclusions (Noise Filter — Sovereign Rule) ─────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/.next/**,\
  **/dist/**,\
  **/storage/**,\
  **/bootstrap/cache/**,\
  **/public/**,\
  **/*.lock,\
  **/coverage/**,\
  **/_ide_helper*.php

# ─── Test Exclusions ─────────────────────────────────────────
sonar.test.exclusions=**/node_modules/**,**/vendor/**

# ─── PHP (Laravel Backend) ───────────────────────────────────
sonar.php.version=8.4
sonar.php.coverage.reportPaths=apps/backend/coverage/clover.xml
sonar.php.tests.reportPath=apps/backend/coverage/junit.xml

# ─── TypeScript/JavaScript (Next.js Frontend) ────────────────
sonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=apps/frontend/tsconfig.json

# ─── Encoding ────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
