[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_pgsql", "php84Extensions.gd", "php84Extensions.redis", "php84Extensions.intl", "php84Extensions.bcmath"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --classmap-authoritative"]

[phases.build]
cmds = ["npm install && npm run build", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache", "php artisan event:cache"]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
