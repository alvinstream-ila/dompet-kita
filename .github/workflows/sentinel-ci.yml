name: Dompet Kita Sentinel CI (v7.0 - Sovereign Sentinel)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sentinel-osv:
    name: "Sovereign OSV Audit"
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5
    with:
      scan-args: ./
      upload-sarif: false

  sentinel-gate:
    name: "Sovereign Security & Quality Gate"
    needs: [sentinel-osv]
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dompet_kita_test
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, bcmath, json, pgsql, pdo_pgsql
          coverage: none
          tools: phpstan, pint
          
      - name: 📦 Install Monorepo Dependencies
        run: npm ci --ignore-scripts
        
      - name: 📦 Install Backend Dependencies
        working-directory: ./apps/backend
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          cp .env.example .env
          php artisan key:generate
        
      - name: 🧹 Linting Check (PHP Pint)
        working-directory: ./apps/backend
        run: ./vendor/bin/pint --test

      - name: 🧠 Static Analysis (PHPStan Level 9)
        working-directory: ./apps/backend
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: 🕵️ Dependency Audit (Composer)
        working-directory: ./apps/backend
        run: composer audit

      - name: 🕵️ Dependency Audit (NPM)
        run: npm audit --audit-level=high

      - name: 🛡️ Vulnerability Scan (Trivy FS - Unlimited)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret,misconfig'
          trivy-config: trivy.yaml
          skip-dirs: 'apps/backend/vendor,node_modules'

      - name: 🗄️ Run Database Migrations
        working-directory: ./apps/backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: dompet_kita_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: 🤺 Run Sentinel Security Gate
        working-directory: ./apps/backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: dompet_kita_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: php artisan security:gate --min-score=100

      - name: 🧪 Run Backend Logic Tests (Pest)
        working-directory: ./apps/backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: dompet_kita_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: php artisan test --env=testing

      - name: 🏗️ Build Production Bundle
        working-directory: ./apps/frontend
        run: npm run build

