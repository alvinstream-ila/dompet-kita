name: Dompet Kita Security Sentinel (Trivy Audit)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-audit:
    name: "Full-Spectrum Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan Monorepo with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' # Block build if vulnerabilities found
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret,misconfig'

      - name: PHP Dependency Audit (Composer)
        working-directory: ./apps/backend
        run: composer audit

      - name: Node.js Dependency Audit (NPM)
        working-directory: ./apps/frontend
        run: npm audit --audit-level=high
