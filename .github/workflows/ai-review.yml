name: AI Code Reviewer (Qodo Merge)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

jobs:
  pr_agent_job:
    # Do not run if the event is a bot comment
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: 🤖 Run PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Map your GitHub Secret to the PR Agent environment variable
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Use Gemini 3 Flash as discussed for free-tier sustainability
          github_action_config.model: "gemini/gemini-1.5-flash"
          # Other configurations can be set here or in .pr_agent.toml
